# Renders the apps' windows with demo data for the website's docs (windows/Flock.Screenshots,
# macos/Sources/FlockScreenshots) and keeps the PNGs as run artifacts, by hand from the Actions
# tab. A workflow of its own, so these files never mix with the build artifacts that release-beta.yml
# and release-stable.yml publish.
name: Screenshots

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    windows:
        name: Windows
        runs-on: windows-2025
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 10.0.x

            -   name: Render
                #language=powershell
                run: |
                    dotnet build windows/Flock.Screenshots -c Release -p:Platform=x64
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    $exe = Get-ChildItem windows/Flock.Screenshots/bin/x64/Release -Recurse -Filter Flock.Screenshots.exe | Select-Object -First 1
                    & $exe.FullName --out screenshots --only panel-running
                    exit $LASTEXITCODE

            -   uses: actions/upload-artifact@v7
                if: always()
                with:
                    name: screenshots-windows
                    path: screenshots/*.png
                    if-no-files-found: error

    linux:
        name: Linux
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v7

            -   name: Install GTK
                run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev xvfb

            -   name: Render
                env:
                    GSK_RENDERER: cairo
                    GDK_BACKEND: x11
                run: |
                    for theme in light dark; do
                        xvfb-run -a cargo run --manifest-path linux/Cargo.toml --features screenshots -- --screenshots --out screenshots --only panel-running --theme $theme
                    done

            -   uses: actions/upload-artifact@v7
                if: always()
                with:
                    name: screenshots-linux
                    path: screenshots/*.png
                    if-no-files-found: error
